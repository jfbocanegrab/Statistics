[uwsgi]
; NGINX habla con este backend por HTTP (proxy_pass) a través del Service de K8s,
; así no dependemos de sockets compartidos entre pods.
http-socket = :8000
module = wsgi:application
master = true
processes = 4
threads = 2
enable-threads = true
; Debe ser >= que el tiempo de generación del PDF más pesado
harakiri = 120
; El límite de subida lo aplican NGINX (client_max_body_size) y Flask (MAX_UPLOAD_MB -> 413 JSON).
; No usar limit-post: uWSGI corta la conexión sin respuesta y el usuario no ve un mensaje claro.
post-buffering = 65536
buffer-size = 32768
die-on-term = true
need-app = true
vacuum = true
max-requests = 500
disable-logging = false
log-4xx = true
log-5xx = true
; matplotlib necesita un directorio de cache escribible
env = MPLCONFIGDIR=/tmp/mpl
