apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: statgraph-backend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/component: backend }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: statgraph-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/component: frontend }
