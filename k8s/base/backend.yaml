apiVersion: apps/v1
kind: Deployment
metadata:
  name: statgraph-backend
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/component: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: statgraph-backend          # reemplazada por kustomize (images:)
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: MAX_UPLOAD_MB, value: "50" }   # igual que client_max_body_size y proxy-body-size
            - { name: MPLCONFIGDIR, value: /tmp/mpl }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: statgraph-backend
spec:
  selector: { app.kubernetes.io/component: backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
