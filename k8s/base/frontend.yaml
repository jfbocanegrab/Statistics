apiVersion: apps/v1
kind: Deployment
metadata:
  name: statgraph-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/component: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: statgraph-frontend         # reemplazada por kustomize (images:)
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # Nombre DNS del Service, relativo al namespace: idéntico en Staging y Prod (nunca una IP).
            - { name: BACKEND_URL, value: "http://statgraph-backend:8000" }
            - { name: MAX_UPLOAD_MB, value: "50" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: statgraph-frontend
spec:
  selector: { app.kubernetes.io/component: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
